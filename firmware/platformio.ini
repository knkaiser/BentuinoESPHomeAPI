; PlatformIO project for the standalone ESPHome native API server.
; The reusable library lives in lib/ESPHomeAPI; the demo app is in src/main.cpp.

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    ; Provide WiFi credentials at build time (or edit src/main.cpp):
    ; -DWIFI_SSID='"my-ssid"'
    ; -DWIFI_PASSWORD='"my-pass"'
build_src_flags =
    -DESPHOME_API_SERIAL_BRIDGE
    -Ilib/ESPHomeAPI/src
    -Iexamples/_common
    -include serial_log_bridge_install.h
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
